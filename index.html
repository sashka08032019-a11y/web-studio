<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Web-разработка</title>
    <meta
      name="description"
      content="Разработка сайтов и веб-сервисов под задачи бизнеса."
    />

    <!-- Адрес сайта берётся из .env (VITE_SITE_URL) и подставляется при сборке -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta name="theme-color" content="#14161a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Web-разработка" />
    <meta property="og:title" content="Web-разработка" />
    <meta
      property="og:description"
      content="Разработка сайтов и веб-сервисов под задачи бизнеса."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Web-разработка — сайты и веб-сервисы под задачи бизнеса"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Web-разработка",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "description": "Разработка сайтов и веб-сервисов под задачи бизнеса: лендинги, корпоративные сайты, интернет-магазины.",
        "serviceType": [
          "Разработка сайтов",
          "Разработка лендингов",
          "Разработка интернет-магазинов",
          "Поддержка сайтов"
        ],
        "areaServed": "RU",
        "availableLanguage": ["ru"],
        "priceRange": "$$",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "you@example.com",
          "url": "https://t.me/username",
          "availableLanguage": ["ru"]
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
