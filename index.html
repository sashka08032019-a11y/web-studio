<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Разработка сайтов и веб-сервисов | Виталий Сбоев</title>
    <meta
      name="description"
      content="Разработка сайтов и веб-сервисов под задачи бизнеса: лендинги, корпоративные сайты, интернет-магазины и поддержка. Портфолио и контакты."
    />

    <!-- Адрес сайта берётся из .env (VITE_SITE_URL) и подставляется при сборке -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta name="theme-color" content="#14161a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Виталий Сбоев" />
    <meta
      property="og:title"
      content="Разработка сайтов и веб-сервисов | Виталий Сбоев"
    />
    <meta
      property="og:description"
      content="Разработка сайтов и веб-сервисов под задачи бизнеса: лендинги, корпоративные сайты, интернет-магазины и поддержка. Портфолио и контакты."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Виталий Сбоев — разработка сайтов и веб-сервисов"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "%VITE_SITE_URL%/#person",
            "name": "Виталий Сбоев",
            "url": "%VITE_SITE_URL%/",
            "jobTitle": "Веб-разработчик",
            "email": "Sboev_Vitalii@mail.ru",
            "sameAs": [
              "https://github.com/sboevvitalii",
              "https://t.me/Sboev_Vitalii"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "Виталий Сбоев — разработка сайтов и веб-сервисов",
            "description": "Разработка сайтов и веб-сервисов под задачи бизнеса: лендинги, корпоративные сайты, интернет-магазины и поддержка.",
            "inLanguage": "ru",
            "publisher": { "@id": "%VITE_SITE_URL%/#person" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
